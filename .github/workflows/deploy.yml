name: Deploy to GCP Cloud Run

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy aivorah-backend \
            --source=. \
            --region=asia-south1 \
            --project=aivorah-app \
            --platform=managed \
            --allow-unauthenticated \
            --memory=2Gi \
            --cpu=2

      - name: Print live URL
        run: |
          URL=$(gcloud run services describe aivorah-backend --region=asia-south1 --project=aivorah-app --format='value(status.url)')
          echo "Deployed to: $URL"
