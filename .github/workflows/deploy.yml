name: Deploy to GCP Cloud Run

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t asia-south1-docker.pkg.dev/aivorah-app/aivorah/aivorah-backend:${{ github.sha }} \
            -t asia-south1-docker.pkg.dev/aivorah-app/aivorah/aivorah-backend:latest \
            .

      - name: Push Docker image
        run: |
          docker push --all-tags asia-south1-docker.pkg.dev/aivorah-app/aivorah/aivorah-backend

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy aivorah-backend \
            --image=asia-south1-docker.pkg.dev/aivorah-app/aivorah/aivorah-backend:${{ github.sha }} \
            --region=asia-south1 \
            --project=aivorah-app \
            --platform=managed \
            --allow-unauthenticated \
            --memory=2Gi \
            --cpu=2 \
            --set-env-vars="QDRANT_URL=${{ secrets.QDRANT_URL }},QDRANT_API_KEY=${{ secrets.QDRANT_API_KEY }},GROQ_API_KEY=${{ secrets.GROQ_API_KEY }},ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }},ELEVENLABS_AIVORAH_KEY=${{ secrets.ELEVENLABS_AIVORAH_KEY }},CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }},CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }},CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }},SUPABASE_URL=${{ secrets.SUPABASE_URL }},SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }},NEWS_API_KEY=${{ secrets.NEWS_API_KEY }},EMAIL_USER=${{ secrets.EMAIL_USER }},EMAIL_PASS=${{ secrets.EMAIL_PASS }},ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}"

      - name: Print live URL
        run: |
          URL=$(gcloud run services describe aivorah-backend --region=asia-south1 --project=aivorah-app --format='value(status.url)')
          echo "Deployed to: $URL"
