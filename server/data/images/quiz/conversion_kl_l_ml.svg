<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="460" height="220">
  <rect x="6" y="6" width="448" height="208" rx="5" fill="#fff" stroke="#222" stroke-width="2.5"/>

  <!-- ═══ LEFT CIRCLE (kL ↔ L) ═══ -->
  <!-- Top arc: from left (kL side) sweeping clockwise over the top to right (L side) -->
  <path d="M 110,115 A 60,60 0 1,1 210,115" fill="none" stroke="#7B2020" stroke-width="4"/>
  <!-- Bottom arc: from right (L side) sweeping clockwise under the bottom to left (kL side) -->
  <path d="M 210,115 A 60,60 0 1,1 110,115" fill="none" stroke="#7B2020" stroke-width="4"/>

  <!-- Arrowhead top-right of left circle (×1000 direction: kL → L) -->
  <polygon points="203,88 217,88 210,104" fill="#7B2020"/>
  <!-- Arrowhead bottom-left of left circle (÷1000 direction: L → kL) -->
  <polygon points="103,126 117,126 110,142" fill="#7B2020"/>

  <!-- ═══ RIGHT CIRCLE (L ↔ mL) ═══ -->
  <!-- Top arc -->
  <path d="M 240,115 A 60,60 0 1,1 340,115" fill="none" stroke="#7B2020" stroke-width="4"/>
  <!-- Bottom arc -->
  <path d="M 340,115 A 60,60 0 1,1 240,115" fill="none" stroke="#7B2020" stroke-width="4"/>

  <!-- Arrowhead top-right of right circle (×1000 direction: L → mL) -->
  <polygon points="333,88 347,88 340,104" fill="#7B2020"/>
  <!-- Arrowhead bottom-left of right circle (÷1000 direction: mL → L) -->
  <polygon points="233,126 247,126 240,142" fill="#7B2020"/>

  <!-- ═══ UNIT LABELS (on top of circles so they're readable) ═══ -->
  <rect x="48" y="96" width="56" height="38" fill="#fff" rx="2"/>
  <text x="76" y="124" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="800" fill="#1a1a1a" text-anchor="middle">kL</text>

  <rect x="186" y="96" width="28" height="38" fill="#fff" rx="2"/>
  <text x="200" y="124" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="800" fill="#1a1a1a" text-anchor="middle">L</text>

  <rect x="340" y="96" width="64" height="38" fill="#fff" rx="2"/>
  <text x="372" y="124" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="800" fill="#1a1a1a" text-anchor="middle">mL</text>

  <!-- ═══ MULTIPLIER LABELS (×1000 above) ═══ -->
  <text x="160" y="38" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#7B2020" text-anchor="middle">&#x00D7;1000</text>
  <text x="290" y="38" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#7B2020" text-anchor="middle">&#x00D7;1000</text>

  <!-- ═══ DIVISOR LABELS (÷1000 below) ═══ -->
  <text x="160" y="198" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#7B2020" text-anchor="middle">&#x00F7;1000</text>
  <text x="290" y="198" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#7B2020" text-anchor="middle">&#x00F7;1000</text>
</svg>
