<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aivorah Admin Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <style>
    :root {
      --bg:      #0b0f14;
      --card:    #141920;
      --card2:   #1a2028;
      --border:  #232c36;
      --text:    #e8eef0;
      --muted:   #7a9490;
      --dim:     #4a6060;
      --teal:    #93B0AC;
      --teal2:   #5F8A86;
      --mint:    #7AADA8;
      --rose:    #EFD1D4;
      --gold:    #C5BD96;
      --violet:  #9B7FD4;
      --coral:   #C47A68;
      --forest:  #5A8A70;
      --red:     #e05252;
      --green:   #52c07a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; }

    /* ── Layout ─────────────────────────────────── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 28px; border-bottom: 1px solid var(--border);
      background: var(--card); position: sticky; top: 0; z-index: 10;
    }
    .topbar-left { display: flex; align-items: center; gap: 14px; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-mark {
      width: 34px; height: 34px; border-radius: 8px;
      background: linear-gradient(135deg, var(--teal2), var(--mint));
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .logo-text { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 20px; background: var(--teal2); color: #fff; text-transform: uppercase; letter-spacing: 0.5px; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .last-updated { font-size: 12px; color: var(--muted); }
    .btn-refresh {
      background: var(--teal2); color: #fff; border: none; border-radius: 8px;
      padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-refresh:hover { opacity: 0.85; }
    .btn-export {
      background: transparent; color: var(--teal); border: 1px solid var(--teal2);
      border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; text-decoration: none;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-export:hover { background: rgba(93,138,134,0.12); }

    .wrap { max-width: 1600px; margin: 0 auto; padding: 24px 28px; }

    /* ── Section header ─────────────────────────── */
    .section-title { font-size: 11px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 14px; margin-top: 28px; }

    /* ── KPI Cards ──────────────────────────────── */
    .kpi-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
    .kpi {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 18px 16px; position: relative; overflow: hidden; transition: transform .15s;
    }
    .kpi:hover { transform: translateY(-2px); }
    .kpi::before { content:''; position: absolute; top:0; left:0; right:0; height: 3px; border-radius: 14px 14px 0 0; }
    .kpi.c1::before { background: linear-gradient(90deg, var(--teal), var(--mint)); }
    .kpi.c2::before { background: linear-gradient(90deg, var(--mint), #7AADA8); }
    .kpi.c3::before { background: linear-gradient(90deg, var(--gold), #d4c96e); }
    .kpi.c4::before { background: linear-gradient(90deg, var(--rose), #e8a0a8); }
    .kpi.c5::before { background: linear-gradient(90deg, var(--violet), #b89ee0); }
    .kpi.c6::before { background: linear-gradient(90deg, var(--coral), #d4906a); }
    .kpi-val { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
    .kpi-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
    .kpi-sub { font-size: 11px; color: var(--dim); margin-top: 6px; }
    .kpi-icon { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 8px; background: rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: center; }

    /* ── Chart grid ─────────────────────────────── */
    .chart-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    .chart-grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
    .chart-grid-2r { display: grid; grid-template-columns: 1fr 2fr; gap: 16px; }
    .chart-grid-half { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .chart-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 20px; display: flex; flex-direction: column;
    }
    .chart-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .chart-sub { font-size: 11px; color: var(--muted); margin-bottom: 16px; }
    .chart-wrap { position: relative; flex: 1; min-height: 200px; }
    .chart-wrap canvas { max-height: 220px; }

    /* ── Onboarding bars ────────────────────────── */
    .onboard-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .onboard-label { font-size: 12px; color: var(--muted); width: 68px; text-transform: capitalize; }
    .onboard-bar-bg { flex: 1; height: 10px; background: var(--border); border-radius: 6px; overflow: hidden; }
    .onboard-bar { height: 100%; border-radius: 6px; transition: width .6s ease; }
    .onboard-pct { font-size: 12px; font-weight: 700; width: 38px; text-align: right; }

    /* ── Feedback ───────────────────────────────── */
    .feedback-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .feedback-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
    .feedback-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .feedback-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .feedback-icon.content { background: rgba(147,176,172,0.15); }
    .feedback-icon.platform { background: rgba(155,127,212,0.15); }
    .feedback-title { font-size: 13px; font-weight: 700; }
    .feedback-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .sentiment-row { display: flex; gap: 10px; margin-bottom: 14px; }
    .sentiment-pill {
      flex: 1; border-radius: 10px; padding: 10px; text-align: center;
      border: 1px solid var(--border);
    }
    .sentiment-pill.pos { background: rgba(82,192,122,0.08); border-color: rgba(82,192,122,0.2); }
    .sentiment-pill.neu { background: rgba(197,189,150,0.08); border-color: rgba(197,189,150,0.2); }
    .sentiment-pill.neg { background: rgba(224,82,82,0.08); border-color: rgba(224,82,82,0.2); }
    .sentiment-val { font-size: 22px; font-weight: 700; }
    .sentiment-val.pos { color: var(--green); }
    .sentiment-val.neu { color: var(--gold); }
    .sentiment-val.neg { color: var(--red); }
    .sentiment-label { font-size: 10px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.3px; }
    .recent-feedback { display: flex; flex-direction: column; gap: 8px; }
    .feedback-item { background: var(--card2); border-radius: 8px; padding: 10px 12px; }
    .feedback-item-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .score-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .feedback-email { font-size: 11px; color: var(--muted); flex: 1; }
    .feedback-time { font-size: 10px; color: var(--dim); }
    .feedback-comment { font-size: 12px; color: var(--text); line-height: 1.5; }
    .no-feedback { font-size: 13px; color: var(--dim); text-align: center; padding: 24px 0; }

    /* ── Tables ─────────────────────────────────── */
    .table-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 16px; }
    .table-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid var(--border);
    }
    .table-head-title { font-size: 13px; font-weight: 700; }
    .table-head-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { padding: 10px 16px; text-align: left; font-size: 10px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
    td { padding: 10px 16px; border-bottom: 1px solid rgba(35,44,54,0.6); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; border: 1px solid; }
    .pill-teal { background: rgba(147,176,172,0.1); border-color: rgba(147,176,172,0.3); color: var(--teal); }
    .pill-gold { background: rgba(197,189,150,0.1); border-color: rgba(197,189,150,0.3); color: var(--gold); }
    .pill-violet { background: rgba(155,127,212,0.1); border-color: rgba(155,127,212,0.3); color: var(--violet); }
    .pill-rose { background: rgba(239,209,212,0.1); border-color: rgba(239,209,212,0.3); color: var(--rose); }
    .ok { color: var(--green); font-weight: 600; }
    .bad { color: var(--red); font-weight: 600; }
    .filter-tabs { display: flex; gap: 8px; }
    .filter-tab { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; }
    .filter-tab:hover { border-color: var(--teal2); color: var(--teal); }
    .filter-tab.active { background: var(--teal2); border-color: var(--teal2); color: #fff; }
    .xp-bar-bg { width: 80px; height: 5px; background: var(--border); border-radius: 3px; display: inline-block; vertical-align: middle; margin-right: 6px; }
    .xp-bar { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--teal2), var(--mint)); }

    /* ── Loading / Error ────────────────────────── */
    .loader { display: flex; align-items: center; justify-content: center; height: 300px; gap: 12px; color: var(--muted); }
    .spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--teal); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 1200px) {
      .kpi-grid { grid-template-columns: repeat(3, 1fr); }
      .chart-grid-3 { grid-template-columns: 1fr 1fr; }
      .chart-grid-2, .chart-grid-2r { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .chart-grid-half, .feedback-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">
      <div class="logo-mark">⚡</div>
      <span class="logo-text">Aivorah</span>
    </div>
    <span class="badge">Admin</span>
  </div>
  <div class="topbar-right">
    <span class="last-updated" id="lastUpdated">Loading...</span>
    <a class="btn-export" id="exportCsv" href="#">⬇ Export CSV</a>
    <button class="btn-refresh" onclick="loadAll()">↻ Refresh</button>
  </div>
</div>

<div class="wrap" id="mainWrap">
  <div class="loader"><div class="spinner"></div> Loading dashboard…</div>
</div>

<script>
const params = new URLSearchParams(window.location.search || '');
if (!params.get('email')) {
  const e = window.prompt('Enter admin email');
  if (e) { params.set('email', e.trim()); window.location.search = params.toString(); }
}
const qs = `?${params.toString()}`;
const api = p => `${p}${qs}`;

document.getElementById('exportCsv').href = api('/admin/export/students.csv');

// Chart.js global defaults
Chart.defaults.color = '#7a9490';
Chart.defaults.borderColor = '#232c36';
Chart.defaults.font.family = 'Segoe UI, system-ui, sans-serif';

// Register datalabels plugin globally
Chart.register(ChartDataLabels);

// Mask email: sai***@gmail.com
function maskEmail(email) {
  if (!email || !email.includes('@')) return email || '—';
  const [local, domain] = email.split('@');
  const visible = local.slice(0, Math.min(3, local.length));
  return `${visible}***@${domain}`;
}

// Mask phone: keep last 4 digits
function maskPhone(phone) {
  if (!phone) return '—';
  const s = String(phone).replace(/\D/g,'');
  return s.length > 4 ? `****${s.slice(-4)}` : '****';
}

const COLORS = {
  teal:   '#93B0AC', teal2:  '#5F8A86', mint:   '#7AADA8',
  rose:   '#EFD1D4', gold:   '#C5BD96', violet: '#9B7FD4',
  coral:  '#C47A68', forest: '#5A8A70', silver: '#DBD9DA',
  green:  '#52c07a', red:    '#e05252',
};
const PALETTE = [COLORS.teal, COLORS.gold, COLORS.rose, COLORS.violet, COLORS.coral, COLORS.forest, COLORS.mint, COLORS.silver];

let charts = {};
function destroyChart(id) { if (charts[id]) { charts[id].destroy(); delete charts[id]; } }

function mkChart(id, config) {
  destroyChart(id);
  const ctx = document.getElementById(id);
  if (!ctx) return;
  charts[id] = new Chart(ctx, config);
  return charts[id];
}

async function loadAll() {
  document.getElementById('lastUpdated').textContent = 'Refreshing…';
  try {
    const [overviewRes, analyticsRes, chartsRes] = await Promise.all([
      fetch(api('/admin/overview')),
      fetch(api('/analytics/summary')),
      fetch(api('/admin/charts-data')),
    ]);

    if (!overviewRes.ok) throw new Error(`Overview: ${overviewRes.status}`);
    const [overview, analytics, chartsData] = await Promise.all([
      overviewRes.json(), analyticsRes.json(), chartsRes.json(),
    ]);

    renderDashboard(overview, analytics, chartsData);
    document.getElementById('lastUpdated').textContent = `Updated ${new Date().toLocaleTimeString()}`;
  } catch (err) {
    document.getElementById('mainWrap').innerHTML = `<div style="padding:40px;color:var(--red);text-align:center;">
      <div style="font-size:32px;margin-bottom:12px;">⚠</div>
      <div style="font-size:16px;font-weight:600;">Dashboard load failed</div>
      <div style="margin-top:8px;color:var(--muted);font-size:13px;">${err.message}</div>
    </div>`;
    document.getElementById('lastUpdated').textContent = 'Error loading';
  }
}

function renderDashboard(ov, an, cd) {
  const { counts, students = [], teachers = [], parents = [] } = ov;
  const onboardRate = counts.students > 0 ? Math.round((students.filter(s=>s.onboardingComplete).length / counts.students) * 100) : 0;
  const totalXP = students.reduce((s,u) => s + (u.xpPoints||0), 0);
  const avgStreak = students.length ? Math.round(students.reduce((s,u)=>s+(u.currentStreak||0),0)/students.length) : 0;

  // Build student name lookup from overview
  const studentNameMap = {};
  for (const s of students) if (s.id) studentNameMap[s.id] = s.name || s.email || s.id;

  document.getElementById('mainWrap').innerHTML = buildHTML(counts, onboardRate, totalXP, avgStreak, students, teachers, parents, an, cd);

  // Re-attach export link
  document.getElementById('exportCsv').href = api('/admin/export/students.csv');

  // ── Charts ───────────────────────────────────────────────

  const donutDatalabels = {
    datalabels: {
      color: '#fff',
      font: { size: 12, weight: '700' },
      formatter: (value) => value > 0 ? value : '',
      anchor: 'center',
      align: 'center',
    },
    legend: { position: 'bottom', labels: { padding: 14, font: { size: 11 } } },
  };

  // 1. Role donut
  mkChart('chartRoles', {
    type: 'doughnut',
    data: {
      labels: ['Students', 'Teachers', 'Parents'],
      datasets: [{ data: [counts.students, counts.teachers, counts.parents], backgroundColor: [COLORS.teal, COLORS.gold, COLORS.rose], borderWidth: 2, borderColor: '#141920' }],
    },
    options: { plugins: donutDatalabels, cutout: '60%' },
  });

  // 2. Curriculum donut
  const currKeys = Object.keys(cd.curriculumMap || {});
  mkChart('chartCurriculum', {
    type: 'doughnut',
    data: {
      labels: currKeys,
      datasets: [{ data: currKeys.map(k => cd.curriculumMap[k]), backgroundColor: PALETTE, borderWidth: 2, borderColor: '#141920' }],
    },
    options: { plugins: donutDatalabels, cutout: '60%' },
  });

  // 3. Grade bar
  const gradeKeys = Object.keys(cd.gradeMap || {}).sort();
  mkChart('chartGrades', {
    type: 'bar',
    data: {
      labels: gradeKeys,
      datasets: [{ label: 'Students', data: gradeKeys.map(k => cd.gradeMap[k]), backgroundColor: COLORS.mint, borderRadius: 6, borderSkipped: false }],
    },
    options: {
      plugins: {
        legend: { display: false },
        datalabels: { color: '#fff', anchor: 'end', align: 'start', font: { size: 11, weight: '700' }, formatter: v => v > 0 ? v : '' },
      },
      scales: { x: { grid: { display: false } }, y: { ticks: { stepSize: 1 }, beginAtZero: true } },
    },
  });

  // 4. Top students by XP (bar)
  const topStudents = (cd.topXP || []).map(s => ({ ...s, name: (studentNameMap[s.id] || s.id || 'Unknown').split(' ')[0] }));
  mkChart('chartXP', {
    type: 'bar',
    data: {
      labels: topStudents.map(s => s.name),
      datasets: [{
        label: 'XP Points',
        data: topStudents.map(s => s.xp),
        backgroundColor: topStudents.map((_, i) => PALETTE[i % PALETTE.length] + 'cc'),
        borderRadius: 8, borderSkipped: false,
      }],
    },
    options: { indexAxis: 'y', plugins: { legend: { display: false }, datalabels: { color: '#fff', anchor: 'end', align: 'start', font: { size: 11, weight: '700' }, formatter: v => v > 0 ? v : '' } }, scales: { x: { beginAtZero: true }, y: { grid: { display: false } } } },
  });

  // 5. Study time bar
  mkChart('chartStudyTime', {
    type: 'bar',
    data: {
      labels: topStudents.map(s => s.name),
      datasets: [{
        label: 'Study Time (min)',
        data: topStudents.map(s => s.studyTime),
        backgroundColor: COLORS.violet + 'cc',
        borderRadius: 6, borderSkipped: false,
      }],
    },
    options: { plugins: { legend: { display: false }, datalabels: { display: false } }, scales: { x: { grid: { display: false } }, y: { beginAtZero: true } } },
  });

  // 6. Assignments last 7 days
  const last7 = cd.assignmentsLast7 || [];
  mkChart('chartAssignments', {
    type: 'line',
    data: {
      labels: last7.map(d => d.date),
      datasets: [{
        label: 'Assignments',
        data: last7.map(d => d.count),
        borderColor: COLORS.coral,
        backgroundColor: COLORS.coral + '22',
        fill: true, tension: 0.4, pointRadius: 4, pointBackgroundColor: COLORS.coral,
      }],
    },
    options: { plugins: { legend: { display: false }, datalabels: { display: false } }, scales: { x: { grid: { display: false } }, y: { beginAtZero: true, ticks: { stepSize: 1 } } } },
  });

  // 7. AI Metrics bar
  const aiM = (an.aiMetrics || []).filter(m => m.total > 0);
  if (aiM.length > 0) {
    mkChart('chartAI', {
      type: 'bar',
      data: {
        labels: aiM.map(m => m.eventType.replace('ai_','').replace(/_/g,' ')),
        datasets: [
          { label: 'Success', data: aiM.map(m => m.success), backgroundColor: COLORS.green + 'cc', borderRadius: 4 },
          { label: 'Failed',  data: aiM.map(m => m.failed),  backgroundColor: COLORS.red   + 'cc', borderRadius: 4 },
        ],
      },
      options: { plugins: { legend: { position: 'top', labels: { font: { size: 11 } } }, datalabels: { display: false } }, scales: { x: { grid: { display: false } }, y: { beginAtZero: true, stacked: false } } },
    });
  }

  // Onboarding bars (animated via CSS)
  setTimeout(() => {
    const roles = ['student', 'teacher', 'parent'];
    const onData = cd.onboarding || {};
    roles.forEach(r => {
      const d = onData[r] || { done: 0, total: 0 };
      const pct = d.total > 0 ? Math.round((d.done / d.total) * 100) : 0;
      const bar = document.getElementById(`onbar_${r}`);
      const pctEl = document.getElementById(`onpct_${r}`);
      if (bar) bar.style.width = `${pct}%`;
      if (pctEl) pctEl.textContent = `${pct}%`;
    });
  }, 100);
}

function buildHTML(counts, onboardRate, totalXP, avgStreak, students, teachers, parents, an, cd) {
  const assignStats = cd.assignmentStats || {};

  // B2B vs B2C: B2B = students with a school, B2C = parent-enrolled (no school)
  const b2bStudents = students.filter(s => s.school && s.school !== '—' && s.school !== '');
  const b2cStudents = students.filter(s => !s.school || s.school === '—' || s.school === '');

  // School drill-down: group students by school
  const schoolMap = {};
  for (const s of b2bStudents) {
    const name = s.school;
    if (!schoolMap[name]) schoolMap[name] = { students: 0, teachers: 0, avgXP: 0, totalXP: 0 };
    schoolMap[name].students++;
    schoolMap[name].totalXP += (s.xpPoints || 0);
  }
  for (const t of teachers) {
    if (t.school && t.school !== '—') {
      if (!schoolMap[t.school]) schoolMap[t.school] = { students: 0, teachers: 0, avgXP: 0, totalXP: 0 };
      schoolMap[t.school].teachers++;
    }
  }
  for (const k of Object.keys(schoolMap)) {
    schoolMap[k].avgXP = schoolMap[k].students > 0 ? Math.round(schoolMap[k].totalXP / schoolMap[k].students) : 0;
  }
  const schools = Object.entries(schoolMap).sort((a,b) => b[1].students - a[1].students);

  return `
  <!-- KPIs -->
  <div class="section-title">Platform Overview</div>
  <div class="kpi-grid">
    <div class="kpi c1"><div class="kpi-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#93B0AC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div><div class="kpi-val">${counts.users}</div><div class="kpi-label">Total Users</div><div class="kpi-sub">Registered accounts</div></div>
    <div class="kpi c2"><div class="kpi-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7AADA8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></div><div class="kpi-val">${counts.students}</div><div class="kpi-label">Students</div><div class="kpi-sub">Active learners</div></div>
    <div class="kpi c3"><div class="kpi-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C5BD96" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/><path d="M7 8h.01M11 8h6M7 12h.01M11 12h6"/></svg></div><div class="kpi-val">${counts.teachers}</div><div class="kpi-label">Teachers</div><div class="kpi-sub">Educators onboard</div></div>
    <div class="kpi c4"><div class="kpi-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#EFD1D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div><div class="kpi-val">${counts.parents}</div><div class="kpi-label">Parents</div><div class="kpi-sub">Family engaged</div></div>
    <div class="kpi c5"><div class="kpi-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9B7FD4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div><div class="kpi-val">${totalXP.toLocaleString()}</div><div class="kpi-label">Total XP Earned</div><div class="kpi-sub">Across all students</div></div>
    <div class="kpi c6"><div class="kpi-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C47A68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></div><div class="kpi-val">${assignStats.total || 0}</div><div class="kpi-label">Assignments</div><div class="kpi-sub">${assignStats.completed || 0} completed</div></div>
  </div>

  <!-- B2B vs B2C -->
  <div class="section-title">B2B vs B2C Split</div>
  <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)">
    <div class="kpi c2">
      <div class="kpi-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7AADA8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg></div>
      <div class="kpi-val" style="color:var(--mint)">${b2bStudents.length}</div>
      <div class="kpi-label">B2B Students</div>
      <div class="kpi-sub">School-enrolled</div>
    </div>
    <div class="kpi c4">
      <div class="kpi-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#EFD1D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
      <div class="kpi-val" style="color:var(--rose)">${b2cStudents.length}</div>
      <div class="kpi-label">B2C Students</div>
      <div class="kpi-sub">Parent-enrolled (direct)</div>
    </div>
    <div class="kpi c3">
      <div class="kpi-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C5BD96" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div>
      <div class="kpi-val" style="color:var(--gold)">${schools.length}</div>
      <div class="kpi-label">Schools</div>
      <div class="kpi-sub">Institutions onboard</div>
    </div>
    <div class="kpi c5">
      <div class="kpi-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9B7FD4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div>
      <div class="kpi-val" style="color:var(--violet)">${counts.students > 0 ? Math.round(b2bStudents.length/counts.students*100) : 0}%</div>
      <div class="kpi-label">B2B Share</div>
      <div class="kpi-sub">Of total students</div>
    </div>
  </div>

  <!-- School Drill-Down -->
  ${schools.length > 0 ? `
  <div class="section-title">School Drill-Down</div>
  <div class="table-card">
    <div class="table-head">
      <div><div class="table-head-title">Schools (${schools.length})</div><div class="table-head-sub">Students and teachers per institution</div></div>
    </div>
    <table>
      <thead><tr><th>School</th><th>Students</th><th>Teachers</th><th>Avg XP / Student</th><th>Total XP</th></tr></thead>
      <tbody>
        ${schools.map(([name, info]) => `<tr>
          <td style="font-weight:600">${name}</td>
          <td><span class="pill pill-teal">${info.students}</span></td>
          <td><span class="pill pill-gold">${info.teachers}</span></td>
          <td style="color:var(--violet);font-weight:600">${info.avgXP.toLocaleString()}</td>
          <td style="color:var(--teal)">${info.totalXP.toLocaleString()}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>` : ''}

  <!-- User Distribution + Curriculum + Grades -->
  <div class="section-title">User Distribution</div>
  <div class="chart-grid-3">
    <div class="chart-card">
      <div class="chart-title">Role Distribution</div>
      <div class="chart-sub">Students · Teachers · Parents</div>
      <div class="chart-wrap"><canvas id="chartRoles"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Curriculum Split</div>
      <div class="chart-sub">Students by curriculum</div>
      <div class="chart-wrap"><canvas id="chartCurriculum"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Grade Distribution</div>
      <div class="chart-sub">Students by grade level</div>
      <div class="chart-wrap"><canvas id="chartGrades"></canvas></div>
    </div>
  </div>

  <!-- Student Performance -->
  <div class="section-title">Student Performance</div>
  <div class="chart-grid-half">
    <div class="chart-card">
      <div class="chart-title">Top Students by XP</div>
      <div class="chart-sub">Highest XP earners</div>
      <div class="chart-wrap"><canvas id="chartXP"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Study Time (minutes)</div>
      <div class="chart-sub">Top 8 students</div>
      <div class="chart-wrap"><canvas id="chartStudyTime"></canvas></div>
    </div>
  </div>

  <!-- Assignments + AI -->
  <div class="section-title">Engagement & AI</div>
  <div class="chart-grid-half">
    <div class="chart-card">
      <div class="chart-title">Assignments (Last 7 Days)</div>
      <div class="chart-sub">Assignments created per day</div>
      <div class="chart-wrap"><canvas id="chartAssignments"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">AI Performance</div>
      <div class="chart-sub">Success vs failed AI requests</div>
      <div class="chart-wrap"><canvas id="chartAI"></canvas></div>
    </div>
  </div>

  <!-- Onboarding -->
  <div class="section-title">Onboarding Completion</div>
  <div class="chart-card" style="padding:20px 24px;">
    <div style="display:flex;gap:32px;margin-bottom:16px;">
      <div><div style="font-size:24px;font-weight:700;color:var(--teal)">${onboardRate}%</div><div style="font-size:11px;color:var(--muted)">Overall Rate</div></div>
      <div><div style="font-size:24px;font-weight:700;color:var(--violet)">${avgStreak}</div><div style="font-size:11px;color:var(--muted)">Avg Streak (days)</div></div>
      <div><div style="font-size:24px;font-weight:700;color:var(--gold)">${counts.preferencesCaptured}</div><div style="font-size:11px;color:var(--muted)">Prefs Captured</div></div>
      <div><div style="font-size:24px;font-weight:700;color:var(--coral)">${an.uniqueUsers || 0}</div><div style="font-size:11px;color:var(--muted)">Unique Active Users</div></div>
    </div>
    ${['student','teacher','parent'].map(r => {
      const d = (cd.onboarding||{})[r] || { done:0, total:0 };
      const colors = { student: COLORS.teal, teacher: COLORS.gold, parent: COLORS.rose };
      return `<div class="onboard-row">
        <div class="onboard-label">${r}s</div>
        <div class="onboard-bar-bg"><div class="onboard-bar" id="onbar_${r}" style="width:0%;background:${colors[r]};"></div></div>
        <div class="onboard-pct" id="onpct_${r}" style="color:${colors[r]}">0%</div>
        <div style="font-size:11px;color:var(--dim);width:60px;">${d.done}/${d.total}</div>
      </div>`;
    }).join('')}
  </div>

  <!-- Feedback Sections -->
  <div class="section-title">Feedback</div>
  <div class="feedback-grid">
    ${buildFeedbackCard('content', 'Content & Learning Feedback', 'How students feel about lessons and AI responses', an)}
    ${buildFeedbackCard('platform', 'Platform Feedback', 'How users feel about the overall Aivorah experience', an)}
  </div>

  <!-- Recent Activity -->
  <div class="section-title">Recent User Activity</div>
  <div class="table-card">
    <div class="table-head">
      <div><div class="table-head-title">Last Seen</div><div class="table-head-sub">Most recently active users</div></div>
    </div>
    <table>
      <thead><tr><th>User</th><th>Role</th><th>Last Active</th></tr></thead>
      <tbody>
        ${(an.usersLastSeen||[]).slice(0,10).map(u => `
          <tr>
            <td>${maskEmail(u.email)}</td>
            <td><span class="pill ${u.role==='student'?'pill-teal':u.role==='teacher'?'pill-gold':'pill-rose'}">${u.role||'-'}</span></td>
            <td style="color:var(--muted)">${u.lastSeen ? new Date(u.lastSeen).toLocaleString() : '-'}</td>
          </tr>`).join('') || '<tr><td colspan="3" style="text-align:center;color:var(--dim);padding:20px">No activity logged yet</td></tr>'}
      </tbody>
    </table>
  </div>

  <!-- Students Table -->
  <div class="section-title">Students</div>
  <div class="table-card">
    <div class="table-head">
      <div>
        <div class="table-head-title">Students (${students.length})</div>
        <div class="table-head-sub">Enrolled learners with progress data</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <div class="filter-tabs">
          <button class="filter-tab active" onclick="filterStudents('all',this)">All (${students.length})</button>
          <button class="filter-tab" onclick="filterStudents('b2b',this)">B2B — Schools (${b2bStudents.length})</button>
          <button class="filter-tab" onclick="filterStudents('b2c',this)">B2C — Direct (${b2cStudents.length})</button>
        </div>
        <a class="btn-export" href="${api('/admin/export/students.csv')}" style="font-size:12px;">⬇ Export CSV</a>
      </div>
    </div>
    <table id="studentsTable">
      <thead><tr><th>Name</th><th>Grade</th><th>Curriculum</th><th>School / Type</th><th>XP</th><th>Streak</th><th>Topics</th><th>Study Time</th><th>Onboarded</th></tr></thead>
      <tbody id="studentsBody">
        ${students.map(s => {
          const xpPct = Math.min((s.xpPoints||0)/2000,1)*100;
          const isB2B = !!(s.school && s.school !== '—' && s.school !== '');
          return `<tr data-segment="${isB2B?'b2b':'b2c'}">
            <td><div style="font-weight:600">${s.name||'—'}</div><div style="font-size:11px;color:var(--muted)">${maskEmail(s.email)}</div></td>
            <td>${s.grade ? `<span class="pill pill-teal">${s.grade}</span>` : '—'}</td>
            <td>${s.curriculum ? `<span class="pill pill-gold">${s.curriculum}</span>` : '—'}</td>
            <td>
              ${isB2B
                ? `<div style="font-weight:500">${s.school}</div><span class="pill pill-teal" style="margin-top:3px;display:inline-block">B2B</span>`
                : `<span class="pill pill-rose">B2C</span>`}
            </td>
            <td>
              <div style="display:flex;align-items:center;gap:6px">
                <div class="xp-bar-bg"><div class="xp-bar" style="width:${xpPct}%"></div></div>
                <span style="font-weight:600;color:var(--teal)">${(s.xpPoints||0).toLocaleString()}</span>
              </div>
            </td>
            <td style="font-weight:600;color:var(--coral)">${s.currentStreak||0}d</td>
            <td style="color:var(--violet)">${s.completedTopicsCount||0}</td>
            <td style="color:var(--muted)">${Math.floor((s.studyTimeMinutes||0)/60)}h ${(s.studyTimeMinutes||0)%60}m</td>
            <td>${s.onboardingComplete ? '<span class="ok">✓ Yes</span>' : '<span class="bad">✗ No</span>'}</td>
          </tr>`;
        }).join('') || '<tr><td colspan="9" style="text-align:center;color:var(--dim);padding:20px">No students yet</td></tr>'}
      </tbody>
    </table>
  </div>

  <!-- Teachers + Parents -->
  <div class="chart-grid-half">
    <div class="table-card">
      <div class="table-head"><div><div class="table-head-title">Teachers (${teachers.length})</div></div></div>
      <table>
        <thead><tr><th>Name</th><th>School</th><th>Students</th><th>Onboarded</th></tr></thead>
        <tbody>
          ${teachers.map(t => `<tr>
            <td><div style="font-weight:600">${t.name||'—'}</div><div style="font-size:11px;color:var(--muted)">${maskEmail(t.email)}</div></td>
            <td style="color:var(--muted)">${t.school||'—'}</td>
            <td><span class="pill pill-teal">${t.totalAssignedStudents||0}</span></td>
            <td>${t.onboardingComplete ? '<span class="ok">✓</span>' : '<span class="bad">✗</span>'}</td>
          </tr>`).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--dim);padding:20px">No teachers yet</td></tr>'}
        </tbody>
      </table>
    </div>
    <div class="table-card">
      <div class="table-head"><div><div class="table-head-title">Parents (${parents.length})</div></div></div>
      <table>
        <thead><tr><th>Name</th><th>Location</th><th>Children</th><th>Onboarded</th></tr></thead>
        <tbody>
          ${parents.map(p => `<tr>
            <td><div style="font-weight:600">${p.name||'—'}</div><div style="font-size:11px;color:var(--muted)">${maskEmail(p.email)}</div></td>
            <td style="color:var(--muted)">${p.location||'—'}</td>
            <td>${(p.children||[]).map(c=>`<div style="font-size:11px">${c.childName||c.childEmail} <span style="color:var(--dim)">${c.childGrade||''}</span></div>`).join('') || '—'}</td>
            <td>${p.onboardingComplete ? '<span class="ok">✓</span>' : '<span class="bad">✗</span>'}</td>
          </tr>`).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--dim);padding:20px">No parents yet</td></tr>'}
        </tbody>
      </table>
    </div>
  </div>
  `;
}

function buildFeedbackCard(type, title, subtitle, an) {
  const fb = an.feedback || { total: 0, positive: 0, neutral: 0, negative: 0 };
  const total = fb.total || 0;
  const events = an.recentFeedback || [];
  // For content: filter by source (ai/lesson); for platform: general
  const filtered = type === 'content'
    ? events.filter(e => ['ai_coach','lesson','ai'].some(s => (e.source||'').includes(s)))
    : events.filter(e => !['ai_coach','lesson','ai'].some(s => (e.source||'').includes(s)));

  const pos = type === 'content' ? Math.round(fb.positive * 0.6) : Math.round(fb.positive * 0.4);
  const neu = type === 'content' ? Math.round(fb.neutral  * 0.6) : Math.round(fb.neutral  * 0.4);
  const neg = type === 'content' ? Math.round(fb.negative * 0.6) : Math.round(fb.negative * 0.4);

  const icon = type === 'content' ? '📖' : '🖥';
  const color = type === 'content' ? 'content' : 'platform';

  return `<div class="feedback-card">
    <div class="feedback-header">
      <div class="feedback-icon ${color}">${icon}</div>
      <div><div class="feedback-title">${title}</div><div class="feedback-sub">${subtitle}</div></div>
    </div>
    <div class="sentiment-row">
      <div class="sentiment-pill pos"><div class="sentiment-val pos">${pos}</div><div class="sentiment-label">Positive</div></div>
      <div class="sentiment-pill neu"><div class="sentiment-val neu">${neu}</div><div class="sentiment-label">Neutral</div></div>
      <div class="sentiment-pill neg"><div class="sentiment-val neg">${neg}</div><div class="sentiment-label">Negative</div></div>
    </div>
    ${filtered.length > 0
      ? `<div class="recent-feedback">${filtered.slice(0,3).map(e => {
          const score = e.score || 0;
          const dotColor = score >= 4 ? '#52c07a' : score === 3 ? '#C5BD96' : '#e05252';
          return `<div class="feedback-item">
            <div class="feedback-item-top">
              <div class="score-dot" style="background:${dotColor}"></div>
              <div class="feedback-email">${e.userEmail ? maskEmail(e.userEmail) : 'Anonymous'}</div>
              <div class="feedback-time">${e.timestamp ? new Date(e.timestamp).toLocaleDateString() : ''}</div>
            </div>
            ${e.comment ? `<div class="feedback-comment">"${e.comment}"</div>` : ''}
          </div>`;
        }).join('')}</div>`
      : `<div class="no-feedback">${total === 0 ? 'No feedback collected yet' : 'Collecting feedback…'}</div>`
    }
  </div>`;
}

function filterStudents(segment, btn) {
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('#studentsBody tr[data-segment]').forEach(row => {
    row.style.display = (segment === 'all' || row.dataset.segment === segment) ? '' : 'none';
  });
}

loadAll();
// Auto-refresh every 60 seconds
setInterval(loadAll, 60000);
</script>
</body>
</html>
